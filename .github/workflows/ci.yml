name: jeffry.in ci 🥤
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache compiled posts and diagrams
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/compiled-content
            public/assets/mermaid
          key: ${{ runner.os }}-post-compile-v1-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-post-compile-v1-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - run: pnpm run lint
      - run: pnpm run test
        env:
          MERMAID_BROWSER_PATH: /usr/bin/google-chrome
      - run: pnpm run build
        env:
          CI: true
          MERMAID_BROWSER_PATH: /usr/bin/google-chrome
      - run: pnpm run test:runtime
        env:
          RUNTIME_BROWSER_PATH: /usr/bin/google-chrome
