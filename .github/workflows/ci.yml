name: jeffry.in ci 🥤
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache compiled posts and diagrams
        uses: actions/cache@v6
        with:
          path: |
            .cache/compiled-content
            public/assets/mermaid
          key: ${{ runner.os }}-post-compile-v1-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-post-compile-v1-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - run: pnpm run lint
      - run: pnpm run build
        env:
          CI: true
          MERMAID_BROWSER_PATH: /usr/bin/google-chrome
