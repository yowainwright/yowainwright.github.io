procs:
  next:
    shell: "nub run dev:next"
    autostart: true
    autorestart: true

  css-watch:
    shell: "nub run dev:css"
    autostart: true
    autorestart: true

  component-styles:
    shell: "nub run generate:component-styles"
    autostart: true
    autorestart: false

  typecheck:
    shell: "nub run typecheck:watch"
    autostart: true
    autorestart: true

  next-typecheck:
    shell: "nub run lint:fix"
    autostart: false
    autorestart: false

  lint-fix:
    shell: "nub run lint:fix"
    autostart: false
    autorestart: false

  format:
    shell: "nub run format"
    autostart: false
    autorestart: false

  pricing-update:
    shell: "nub run watch:pricing"
    autostart: false
    autorestart: true

  clean-build:
    shell: "rm -rf .next out && echo 'Build cache cleaned'"
    autostart: false
    autorestart: false

  clean-all:
    shell: "rm -rf .next out node_modules && echo 'All dependencies and cache cleaned'"
    autostart: false
    autorestart: false

  rebuild-assets:
    shell: "nub run build:css"
    autostart: false
    autorestart: false

  full-rebuild:
    shell: "nub run full-rebuild"
    autostart: false
    autorestart: false

hide_keymap_window: false
